name: Deploy recommendation backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recommendation-backend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: recommendation-backend
      url: https://checkthisout-recommendations.general-zodd.workers.dev/health
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bdf3778fc3116821d7f66381cf4f7f3d
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret. See README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test backend
        run: node --test backend/worker.test.mjs
      - name: Validate backend bundle
        run: pnpm exec wrangler deploy --config backend/wrangler.ci.toml --dry-run
      - name: Deploy backend preserving production variables
        run: pnpm exec wrangler deploy --config backend/wrangler.ci.toml --keep-vars
      - name: Check production readiness
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 3 -H "Origin: https://bishopofbathandwells.github.io" https://checkthisout-recommendations.general-zodd.workers.dev/health | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{if(!JSON.parse(s).ready)process.exit(1);console.log('Recommendation backend ready')})"
