name = "checkthisout-recommendations"
main = "worker.mjs"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
ENABLED = "false"
OPENAI_MODEL = "gpt-6-luna"
ALLOWED_ORIGINS = "http://127.0.0.1:8766,https://checkthisout.general-zodd.workers.dev,https://bishopofbathandwells.github.io"
ALLOWED_SPOTIFY_USERS = ""
DEVELOPER_SPOTIFY_USER = "your-spotify-user-id"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "RecommendationBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RecommendationBudget"]

[[d1_databases]]
binding = "PROFILES"
database_name = "checkthisout-profiles"
database_id = "5dde1a5e-d43e-475d-8691-8aeeb7a5dcfb"
migrations_dir = "migrations"
